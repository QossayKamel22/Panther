<body>
  <!--
    Static pre-boot splash: shown the instant the HTML parses, before the
    Flutter engine has downloaded/booted. Flutter's own root element covers
    the full viewport once it mounts, so this is naturally replaced with no
    extra JS needed — it just closes the gap where the page would otherwise
    be a blank white flash. Mirrors SplashScreen (lib/features/splash) so
    the handoff is seamless.
  -->
  <style>
    #pre-boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #101828, #05070c);
      z-index: 9999;
      opacity: 1;
      transition: opacity 220ms ease-out;
      pointer-events: none;
    }
    #pre-boot-splash.pre-boot-hidden {
      opacity: 0;
    }
    #pre-boot-splash svg {
      width: 80px;
      height: 80px;
      filter: drop-shadow(0 0 22px rgba(53, 99, 233, 0.55));
      animation: pre-boot-pulse 1.4s ease-in-out infinite;
    }
    @keyframes pre-boot-pulse {
      0%, 100% { opacity: 0.75; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
  <div id="pre-boot-splash">
    <svg viewBox="0 0 1024 1024" role="img" aria-label="PANTHER">
      <path d="M 714.25,87.69 L 657.68,67.89 L 544.53,53.75 L 103.25,50.92 L 108.91,62.23 L 168.31,110.32 L 216.40,158.41 L 227.71,175.38 L 244.69,186.70 L 499.27,189.52 L 510.59,158.41 L 527.56,141.44 L 536.04,138.61 L 575.65,164.07 L 606.76,192.35 L 620.91,192.35 L 677.48,212.15 L 739.71,246.10 L 753.86,260.24 L 753.86,285.70 L 762.34,299.85 L 804.77,333.79 L 830.23,362.08 L 827.40,373.39 L 810.43,393.19 L 799.12,415.82 L 768.00,441.28 L 770.83,452.60 L 753.86,480.88 L 731.23,492.20 L 668.99,475.23 L 654.85,449.77 L 564.33,441.28 L 504.93,446.94 L 434.21,469.57 L 397.44,486.54 L 352.18,514.83 L 295.60,560.09 L 275.80,568.57 L 267.31,551.60 L 287.12,483.71 L 287.12,475.23 L 281.46,475.23 L 256.00,503.51 L 227.71,545.94 L 207.91,585.55 L 196.60,622.32 L 190.94,627.98 L 162.65,809.02 L 162.65,834.48 L 145.68,919.34 L 142.85,970.25 L 185.28,970.25 L 205.08,964.60 L 267.31,961.77 L 304.09,953.28 L 371.98,676.07 L 394.61,642.12 L 420.07,622.32 L 442.70,611.01 L 459.67,608.18 L 660.51,608.18 L 728.40,599.69 L 801.94,571.40 L 858.52,526.14 L 878.32,500.69 L 903.78,449.77 L 917.92,384.71 L 915.09,322.48 L 900.95,274.39 L 867.01,209.33 L 835.89,172.55 L 776.49,124.46 Z" fill="#FFFFFF" fill-rule="nonzero"/>
    </svg>
  </div>
  <script>
    // Fades out and removes the pre-boot splash once Flutter actually
    // mounts (<flutter-view>) — without this it would sit at z-index 9999
    // forever and permanently hide the real app underneath it.
    (function () {
      function retire() {
        var el = document.getElementById('pre-boot-splash');
        if (!el) return;
        el.classList.add('pre-boot-hidden');
        setTimeout(function () { el.remove(); }, 260);
      }
      if (document.querySelector('flutter-view')) { retire(); return; }
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view')) {
          retire();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: false });
      // Safety net: never let a loader outlive a reasonable boot budget,
      // even if the host tag Flutter uses ever changes.
      setTimeout(retire, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
