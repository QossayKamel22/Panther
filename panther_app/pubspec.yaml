name: panther_app
description: "PANTHER — Your Second Mind. A context-aware personal AI agent."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^16.2.4

  # State management
  provider: ^6.1.5

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3

  # Local persistence (theme preference, etc.)
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#05070C"
    theme_color: "#3B82F6"
